<head>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1ece2;
    --paper: #faf6ed;
    --ink: #0a1628;
    --ink-2: #1c2a3e;
    --ink-soft: #4a5468;
    --rule: #d6cfc0;
    --sky: #cae0ec;
    --sky-deep: #7aaac5;
    --sky-ink: #2a5878;
    --gold: #b8954a;
    --warn: #c64a3a;

    --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --serif: "Instrument Serif", "Georgia", serif;
    --body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(10,22,40,0.04) 1px, transparent 0);
    background-size: 4px 4px;
  }
  ::selection { background: var(--ink); color: var(--paper); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  img { display: block; max-width: 100%; }

  /* Type utilities */
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
  .serif-it { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  .display { font-family: var(--display); font-weight: 600; letter-spacing: -0.035em; line-height: 0.92; }

  /* Layout */
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 56px; }
  @media (max-width: 900px) { .wrap { padding: 0 24px; } }

  /* Reusable rule */
  .hr { height: 1px; background: var(--rule); border: 0; margin: 0; }
  .hr-ink { height: 1px; background: var(--ink); border: 0; margin: 0; }

  /* Section number */
  .secnum {
    display: inline-flex; align-items: baseline; gap: 14px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink); font-weight: 500;
  }
  .secnum b { font-weight: 600; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px; border-radius: 999px;
    font-family: var(--body); font-weight: 500; font-size: 14px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    transition: transform .18s ease, background .18s ease, color .18s ease;
  }
  .btn:hover { transform: translateY(-1px); background: var(--ink-2); }
  .btn.outline { background: transparent; color: var(--ink); }
  .btn.outline:hover { background: var(--ink); color: var(--paper); }
  .btn .arr { display: inline-block; transition: transform .2s ease; }
  .btn:hover .arr { transform: translateX(3px); }

  /* Tag */
  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--sky); color: var(--sky-ink);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600;
  }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--sky-ink); display: inline-block; }
  .dot.live { background: #2d7a4a; box-shadow: 0 0 0 0 rgba(45,122,74,0.6); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(45,122,74,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(45,122,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(45,122,74,0); }
  }

  /* Theme variants applied via [data-theme] on body */
  body[data-theme="ink"] {
    --bg: #0a1628;
    --paper: #0f1d33;
    --ink: #f1ece2;
    --ink-2: #faf6ed;
    --ink-soft: #94a4ba;
    --rule: rgba(241,236,226,0.18);
    --sky: #1a3850;
    --sky-deep: #4a7a9a;
    --sky-ink: #cae0ec;
    --gold: #c9a961;
  }
  body[data-theme="sky"] {
    --bg: #e3edf3;
    --paper: #ffffff;
    --ink: #0a1628;
    --rule: #b6c8d4;
    --sky: #b8d8e8;
    --sky-ink: #1a3a52;
  }

  /* fade-in on load for hero */
  .reveal { opacity: 0; transform: translateY(8px); animation: rise 1s cubic-bezier(.2,.7,.2,1) forwards; }
  .reveal.d1 { animation-delay: .05s; }
  .reveal.d2 { animation-delay: .15s; }
  .reveal.d3 { animation-delay: .25s; }
  .reveal.d4 { animation-delay: .35s; }
  .reveal.d5 { animation-delay: .45s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
</style>
</head>
